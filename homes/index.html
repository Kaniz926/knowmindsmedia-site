<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghar Finder (Demo) — Property search demo by KnowMinds Media</title>
<meta name="description" content="Ghar Finder is a demo real-estate app built by KnowMinds Media: guided home search, match scores, compare tray, EMI calculator and site-visit booking.">
<link rel="canonical" href="https://knowmindsmedia.com/homes/">
<meta name="theme-color" content="#b4532a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b4532a'/%3E%3Cpath d='M14 32 32 16l18 16v18H14z' fill='%23f6e7d3'/%3E%3Crect x='27' y='36' width='10' height='14' fill='%23b4532a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--clay:#b4532a;--clay-d:#8f3f1e;--sand:#f6eee3;--paper:#fffaf3;--ink:#2b211b;--muted:#7d6b5d;--line:#e8d9c5;--olive:#5c6b3a;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--sand);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.serif{font-family:"DM Serif Display",serif;font-weight:400}
.demo{font-size:.8rem;text-align:center;padding:7px 12px;background:var(--ink);color:#e9dccb}
.demo a{color:#ffb38a;font-weight:700}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:76px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:"DM Serif Display";font-size:1.55rem}
.logo svg{width:34px;height:34px}
.logo small{font-family:"DM Sans";font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--clay);border:1px solid var(--clay);border-radius:4px;padding:1px 6px;margin-left:6px}
.sv{border:1.5px solid var(--ink);border-radius:999px;padding:9px 16px;font-weight:700;background:none;cursor:pointer}
/* quiz */
.quiz{display:grid;grid-template-columns:1fr 1fr;min-height:540px;border-radius:28px;overflow:hidden;background:var(--paper);border:1px solid var(--line);margin:10px 0 40px}
.q-art{background:var(--clay);position:relative;overflow:hidden;color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:flex-end}
.q-art svg{position:absolute;inset:0;width:100%;height:100%}
.q-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(80,30,12,.88) 78%)}
.q-art h1,.q-art p{z-index:1}
.q-art h1{font-family:"DM Serif Display";font-size:clamp(2.2rem,4vw,3.4rem);line-height:1.02;position:relative}
.q-art p{position:relative;color:#ffe2d1;margin-top:10px;max-width:380px}
.q-body{padding:40px;display:flex;flex-direction:column}
.q-step{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--clay)}
.q-body h2{font-family:"DM Serif Display";font-size:2rem;margin:6px 0 20px;line-height:1.1}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:16px 18px;text-align:left;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;align-items:center;transition:.15s}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
.opt:hover{border-color:var(--clay)}
.opt[aria-pressed="true"]{border-color:var(--clay);background:#fdf0e8;box-shadow:inset 0 0 0 1px var(--clay)}
.range{margin:10px 0 6px}
.range input{width:100%;accent-color:var(--clay)}
.rv{font-family:"DM Serif Display";font-size:2.4rem;color:var(--clay)}
.q-nav{margin-top:auto;padding-top:26px;display:flex;justify-content:space-between;align-items:center}
.q-dots{display:flex;gap:6px}.q-dots i{width:24px;height:4px;border-radius:9px;background:var(--line)}.q-dots i.on{background:var(--clay)}
.cta{border:0;background:var(--ink);color:#fff;border-radius:14px;padding:13px 22px;font-weight:700;cursor:pointer}
.cta:disabled{opacity:.35;cursor:not-allowed}
.cta.c{background:var(--clay)}
.lnk{background:none;border:0;color:var(--muted);font-weight:700;cursor:pointer}
@media (max-width:860px){.quiz{grid-template-columns:1fr}.q-art{min-height:230px;padding:26px}.q-body{padding:24px}}
/* results */
.rh{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin:10px 0 18px}
.rh h2{font-family:"DM Serif Display";font-size:2.2rem;line-height:1.05}
.rh p{color:var(--muted)}
.filt{display:flex;gap:8px;flex-wrap:wrap}
.filt span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:700}
.filt select{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff;font-weight:700;font-size:.84rem}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:110px}
@media (max-width:1000px){.list{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.list{grid-template-columns:1fr}}
.home{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.home:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(80,40,20,.12)}
.pic{aspect-ratio:4/3;position:relative;cursor:pointer}
.pic svg{width:100%;height:100%;display:block}
.match{position:absolute;top:12px;left:12px;background:#fff;border-radius:999px;padding:5px 10px;font-weight:700;font-size:.8rem;display:flex;gap:6px;align-items:center}
.match i{width:8px;height:8px;border-radius:50%;background:var(--olive)}
.ty{position:absolute;top:12px;right:12px;background:var(--ink);color:#fff;border-radius:6px;padding:3px 8px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.hb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.pr{font-family:"DM Serif Display";font-size:1.6rem}
.hb h3{font-size:1rem;cursor:pointer}
.hb .loc{color:var(--muted);font-size:.86rem}
.facts{display:flex;gap:14px;font-size:.84rem;color:var(--muted);margin-top:6px}
.facts b{color:var(--ink)}
.hact{display:flex;gap:8px;margin-top:14px}
.hact button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px;font-weight:700;cursor:pointer;font-size:.86rem}
.hact button.on{background:var(--olive);border-color:var(--olive);color:#fff}
.hact .v{background:var(--clay);color:#fff;border-color:var(--clay)}
/* compare tray */
.tray{position:fixed;left:50%;bottom:16px;transform:translate(-50%,140%);background:var(--ink);color:#fff;border-radius:20px;padding:12px 14px 12px 20px;display:flex;align-items:center;gap:14px;transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:30;width:min(640px,calc(100% - 24px))}
.tray.on{transform:translate(-50%,0)}
.tray .sl{display:flex;gap:8px;flex:1;overflow:auto}
.tray .sl span{background:#3d3027;border-radius:10px;padding:6px 10px;font-size:.8rem;white-space:nowrap}
.tray button{border:0;background:#ffb38a;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(43,33,27,.55);display:none;place-items:center;padding:14px;z-index:40}
.mbg.on{display:grid}
.mod{background:var(--paper);border-radius:24px;width:min(860px,100%);max-height:92vh;overflow:auto;position:relative;animation:up .3s}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
.x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:#fff;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.det{display:grid;grid-template-columns:1.1fr 1fr}
.det .pic{aspect-ratio:auto;min-height:100%}
.det .b{padding:26px}
.det h2{font-family:"DM Serif Display";font-size:1.9rem;line-height:1.1}
.amen{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.amen span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem}
.emi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.emi h4{font-family:"DM Serif Display";font-size:1.2rem;font-weight:400}
.emi label{display:grid;gap:2px;font-size:.82rem;color:var(--muted);margin-top:10px}
.emi label b{color:var(--ink)}
.emi input{accent-color:var(--clay)}
.emi .out{display:flex;justify-content:space-between;align-items:end;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.emi .out b{font-family:"DM Serif Display";font-size:1.8rem;color:var(--clay);font-weight:400}
@media (max-width:760px){.det{grid-template-columns:1fr}.det .pic{aspect-ratio:4/3}}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:700;color:var(--muted);width:130px}
td.best{color:var(--olive);font-weight:700}
.visit{padding:28px}
.visit h2{font-family:"DM Serif Display";font-size:1.8rem}
.dts{display:flex;gap:8px;overflow:auto;margin:14px 0}
.dts button,.tms button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:700;white-space:nowrap}
.dts button[aria-pressed="true"],.tms button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tms{display:flex;gap:8px;flex-wrap:wrap}
.visit input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:12px;font-size:16px;background:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-20px);background:var(--olive);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.3s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{padding:26px 0 40px;color:var(--muted);font-size:.86rem;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer a{color:var(--clay);font-weight:700}
</style>
</head>
<body>
<div class="demo">Demo app by <a href="https://knowmindsmedia.com/" target="_blank" rel="noopener">KnowMinds Media</a> · Ghar Finder and all listings are fictional.</div>
<header><div class="wrap"><a class="logo" href="#" id="home"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#b4532a"/><path d="M14 32 32 16l18 16v18H14z" fill="#f6e7d3"/><rect x="27" y="36" width="10" height="14" fill="#b4532a"/></svg>Ghar Finder<small>Demo</small></a><button class="sv" id="savedBtn">♥ Saved (<span id="sc">0</span>)</button></div></header>
<main class="wrap" id="main"></main>
<div class="tray" id="tray"><b style="white-space:nowrap">Compare</b><div class="sl" id="tsl"></div><button id="cmp">Compare now</button></div>
<div class="mbg" id="mbg"><div class="mod" id="mod"></div></div>
<div class="toast" id="toast"></div>
<footer><div class="wrap"><span>© 2026 Fictional demo — prices and listings are made up.</span><span>Designed &amp; built by <a href="https://knowmindsmedia.com/" target="_blank" rel="noopener">KnowMinds Media</a> · <a href="https://knowmindsmedia.com/#demo" target="_blank" rel="noopener">Get a property portal</a></span></div></footer>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var A={purpose:null,area:null,budget:60,bhk:null}, step=0, cmp=[], saved=[], sort='match';
try{saved=JSON.parse(localStorage.getItem('gf_saved'))||[]}catch(e){}
var AREAS=['Patia','Jaydev Vihar','Khandagiri','Saheed Nagar','CDA Cuttack','Any area'];
var PAL=[['#e9b384','#7a4a2c','#f6e7d3'],['#9fb3a0','#3f4f3c','#eef2ea'],['#d6c3a5','#6c5a41','#fbf4e8'],['#c78f6f','#5a3524','#f3e2d6'],['#a8b8c8','#3a4a5c','#eef3f8'],['#e3c27a','#6d5420','#fbf3dc']];
var H=[
 {id:1,t:'Sunrise Residency',a:'Patia',bhk:2,sq:1150,p:62,rent:18000,y:'Apartment',f:'3rd of 9',am:['Lift','Power backup','Gym','Covered parking'],age:2},
 {id:2,t:'Green Courtyard Villa',a:'Khandagiri',bhk:3,sq:1850,p:95,rent:32000,y:'Villa',f:'G+1',am:['Garden','Parking','Solar water'],age:1},
 {id:3,t:'Lakeview Heights',a:'Jaydev Vihar',bhk:3,sq:1600,p:110,rent:38000,y:'Apartment',f:'7th of 14',am:['Pool','Clubhouse','Lift','Security'],age:4},
 {id:4,t:'Mango Grove Homes',a:'Khandagiri',bhk:2,sq:980,p:44,rent:14000,y:'Apartment',f:'2nd of 5',am:['Lift','Park nearby'],age:6},
 {id:5,t:'Riverside Nest',a:'CDA Cuttack',bhk:2,sq:1080,p:48,rent:15000,y:'Apartment',f:'4th of 8',am:['Lift','Power backup','Play area'],age:3},
 {id:6,t:'Temple Town Duplex',a:'Saheed Nagar',bhk:4,sq:2400,p:165,rent:55000,y:'Villa',f:'G+2',am:['Terrace','Parking for 2','Modular kitchen'],age:5},
 {id:7,t:'Studio One',a:'Patia',bhk:1,sq:560,p:28,rent:9500,y:'Apartment',f:'5th of 10',am:['Lift','Furnished','Wi-Fi ready'],age:1},
 {id:8,t:'Kalinga Enclave',a:'Saheed Nagar',bhk:3,sq:1500,p:88,rent:29000,y:'Apartment',f:'3rd of 6',am:['Lift','Parking','Security'],age:8},
 {id:9,t:'Orchid Garden',a:'CDA Cuttack',bhk:3,sq:1420,p:72,rent:22000,y:'Apartment',f:'1st of 4',am:['Garden','Parking'],age:7}
];
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},2000)}
function money(l){return l>=100?'₹'+(l/100).toFixed(2).replace(/\.?0+$/,'')+' Cr':'₹'+l+' L'}
function rupee(n){return '₹'+Math.round(n).toLocaleString('en-IN')}
function price(h){return A.purpose==='rent'?rupee(h.rent)+'<small style="font-family:DM Sans;font-size:.9rem;color:var(--muted)">/mo</small>':money(h.p)}
function art(h){var c=PAL[h.id%PAL.length],v=h.y==='Villa';
  return '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><rect width="400" height="300" fill="'+c[2]+'"/><circle cx="'+(300-h.id*12)+'" cy="70" r="34" fill="'+c[0]+'" opacity=".55"/><rect y="230" width="400" height="70" fill="'+c[0]+'" opacity=".35"/>'+
  (v?'<path d="M90 140 200 70l110 70v100H90z" fill="'+c[0]+'"/><path d="M80 145 200 62l120 83" stroke="'+c[1]+'" stroke-width="10" fill="none" stroke-linejoin="round"/><rect x="180" y="180" width="40" height="60" rx="4" fill="'+c[1]+'"/><rect x="115" y="160" width="40" height="34" rx="3" fill="#fff" opacity=".85"/><rect x="245" y="160" width="40" height="34" rx="3" fill="#fff" opacity=".85"/><circle cx="60" cy="210" r="26" fill="#7d9b6b"/><rect x="57" y="215" width="6" height="25" fill="#6b4a2c"/>'
  :'<rect x="120" y="'+(60+h.id*3)+'" width="160" height="'+(180-h.id*3)+'" fill="'+c[0]+'"/><rect x="120" y="'+(60+h.id*3)+'" width="160" height="14" fill="'+c[1]+'"/>'+[0,1,2,3,4].map(function(r){return [0,1,2,3].map(function(k){return '<rect x="'+(136+k*36)+'" y="'+(90+h.id*3+r*28)+'" width="22" height="16" rx="2" fill="#fff" opacity="'+(r*4+k)%3*.2+.45+'"/>'}).join('')}).join('')+'<rect x="185" y="210" width="30" height="30" fill="'+c[1]+'"/><circle cx="330" cy="215" r="22" fill="#7d9b6b"/><rect x="327" y="220" width="6" height="20" fill="#6b4a2c"/>')+'</svg>'}
function score(h){var s=60;if(A.area==='Any area'||h.a===A.area)s+=20;if(A.bhk==='4+'?h.bhk>=4:h.bhk===A.bhk)s+=12;var b=A.purpose==='rent'?h.rent/1000:h.p;var lim=A.purpose==='rent'?A.budget:A.budget;if(b<=lim)s+=8;else s-=Math.min(40,Math.round((b-lim)/lim*60));return Math.max(35,Math.min(99,s))}
/* ---------- quiz ---------- */
var Q=[
 {k:'purpose',h:'Are you looking to buy or rent?',o:[['buy','Buy a home','Own your place'],['rent','Rent a home','Flexible living']]},
 {k:'area',h:'Which area do you prefer?',g:1,o:AREAS.map(function(a){return [a,a,a==='Any area'?'Show everything':'']})},
 {k:'budget',h:'What\'s your budget?'},
 {k:'bhk',h:'How many bedrooms?',g:1,o:[[1,'1 BHK','Singles & couples'],[2,'2 BHK','Small families'],[3,'3 BHK','Growing families'],['4+','4+ BHK','Big & joint families']]}
];
function quiz(){var q=Q[step],h='';
  if(q.k==='budget'){var rent=A.purpose==='rent',mx=rent?60:200,mn=rent?8:20;if(A.budget>mx||A.budget<mn)A.budget=rent?20:70;
    h='<div class="rv" id="rv">'+(rent?rupee(A.budget*1000)+'/mo':money(A.budget))+'</div><div class="range"><input type="range" id="bud" min="'+mn+'" max="'+mx+'" step="'+(rent?1:5)+'" value="'+A.budget+'" aria-label="Budget"></div><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:.84rem"><span>'+(rent?'₹8k':'₹20 L')+'</span><span>'+(rent?'₹60k':'₹2 Cr')+'</span></div>'}
  else h='<div class="opts'+(q.g?' g2':'')+'">'+q.o.map(function(o){return '<button class="opt" data-o="'+o[0]+'" aria-pressed="'+(String(A[q.k])===String(o[0]))+'"><span>'+o[1]+'<small>'+o[2]+'</small></span><span>→</span></button>'}).join('')+'</div>';
  $('#main').innerHTML='<section class="quiz"><div class="q-art"><svg viewBox="0 0 500 540" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="400" cy="90" r="70" fill="#d9774d"/><path d="M0 420 120 300l90 70 120-150 170 200v120H0z" fill="#9c4521"/><path d="M60 360 160 280l100 80v120H60z" fill="#f6e7d3"/><rect x="140" y="400" width="40" height="80" fill="#b4532a"/><rect x="80" y="380" width="40" height="34" fill="#b4532a" opacity=".5"/><rect x="200" y="380" width="40" height="34" fill="#b4532a" opacity=".5"/></svg><h1>Find a home that fits your life.</h1><p>Answer 4 quick questions — we\'ll rank homes by how well they match you.</p></div><div class="q-body"><span class="q-step">Question '+(step+1)+' of 4</span><h2>'+q.h+'</h2>'+h+'<div class="q-nav"><div class="q-dots">'+Q.map(function(x,i){return '<i class="'+(i<=step?'on':'')+'"></i>'}).join('')+'</div><div style="display:flex;gap:10px">'+(step?'<button class="lnk" id="qb">Back</button>':'')+'<button class="cta c" id="qn" '+(q.k!=='budget'&&A[q.k]===null?'disabled':'')+'>'+(step===3?'Show my matches':'Next')+'</button></div></div></div></section>';
  var r=$('#bud');if(r)r.oninput=function(){A.budget=+r.value;$('#rv').textContent=A.purpose==='rent'?rupee(A.budget*1000)+'/mo':money(A.budget)}}
/* ---------- results ---------- */
function results(onlySaved){var list=H.map(function(h){return Object.assign({m:score(h)},h)});if(onlySaved)list=list.filter(function(h){return saved.indexOf(h.id)>-1});
  if(sort==='match')list.sort(function(a,b){return b.m-a.m});if(sort==='lo')list.sort(function(a,b){return a.p-b.p});if(sort==='size')list.sort(function(a,b){return b.sq-a.sq});
  $('#main').innerHTML='<div class="rh"><div><p>'+(onlySaved?'Your shortlist':'Ranked for you')+'</p><h2>'+(onlySaved?'Saved homes':list.length+' homes · '+(A.purpose==='rent'?'to rent':'to buy')+(A.area&&A.area!=='Any area'?' near '+A.area:''))+'</h2></div><div class="filt">'+(onlySaved?'':'<span>'+(A.bhk||'Any')+' BHK</span><span>'+(A.purpose==='rent'?'≤ '+rupee(A.budget*1000)+'/mo':'≤ '+money(A.budget))+'</span><button class="sv" id="redo" style="padding:5px 12px;font-size:.84rem">Edit search</button>')+'<select id="sort" aria-label="Sort"><option value="match">Best match</option><option value="lo">Lowest price</option><option value="size">Largest</option></select></div></div><div class="list">'+(list.length?list.map(card).join(''):'<p style="color:var(--muted)">Nothing saved yet — tap ♥ on a home.</p>')+'</div>';
  $('#sort').value=sort;}
function card(h){return '<article class="home"><div class="pic" data-d="'+h.id+'">'+art(h)+'<span class="match"><i></i>'+h.m+'% match</span><span class="ty">'+h.y+'</span></div><div class="hb"><span class="pr">'+price(h)+'</span><h3 data-d="'+h.id+'">'+h.t+'</h3><span class="loc">📍 '+h.a+', '+(h.a.indexOf('Cuttack')>-1?'Cuttack':'Bhubaneswar')+'</span><div class="facts"><span><b>'+h.bhk+'</b> BHK</span><span><b>'+h.sq+'</b> sq ft</span><span><b>'+h.age+'</b> yr old</span></div><div class="hact"><button data-s="'+h.id+'" class="'+(saved.indexOf(h.id)>-1?'on':'')+'">'+(saved.indexOf(h.id)>-1?'♥ Saved':'♡ Save')+'</button><button data-c="'+h.id+'" class="'+(cmp.indexOf(h.id)>-1?'on':'')+'">'+(cmp.indexOf(h.id)>-1?'✓ Comparing':'+ Compare')+'</button><button class="v" data-v="'+h.id+'">Visit</button></div></div></article>'}
function tray(){$('#tray').classList.toggle('on',cmp.length>0);$('#tsl').innerHTML=cmp.map(function(id){return '<span>'+by(id).t+'</span>'}).join('');$('#cmp').disabled=cmp.length<2;$('#cmp').textContent=cmp.length<2?'Add 1 more':'Compare '+cmp.length}
function by(id){return H.filter(function(h){return h.id===id})[0]}
function modal(h){$('#mod').innerHTML='<button class="x" data-x aria-label="Close">✕</button>'+h;$('#mbg').classList.add('on')}
function detail(id){var h=by(id),m=score(h);modal('<div class="det"><div class="pic">'+art(h)+'<span class="match"><i></i>'+m+'% match</span></div><div class="b"><span class="pr">'+price(h)+'</span><h2>'+h.t+'</h2><p style="color:var(--muted)">📍 '+h.a+' · '+h.bhk+' BHK · '+h.sq+' sq ft · '+h.y+' · Floor '+h.f+'</p><div class="amen">'+h.am.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>'+
  (A.purpose==='rent'?'<p style="font-size:.9rem;color:var(--muted)">Security deposit: '+rupee(h.rent*3)+' (3 months) · Maintenance included.</p>':'<div class="emi"><h4>EMI calculator</h4><label>Loan amount <b id="la"></b><input type="range" id="lr" min="10" max="90" value="80" aria-label="Loan percentage"></label><label>Interest rate <b id="ir"></b><input type="range" id="rr" min="7" max="12" step=".1" value="8.5" aria-label="Interest rate"></label><label>Tenure <b id="tn"></b><input type="range" id="tr" min="5" max="30" value="20" aria-label="Tenure in years"></label><div class="out"><span>Monthly EMI</span><b id="emi"></b></div></div>')+
  '<button class="cta c" data-v="'+h.id+'" style="width:100%;margin-top:16px">Book a site visit</button></div></div>');
  if(A.purpose!=='rent'){var f=function(){var P=h.p*1e5*$('#lr').value/100,r=$('#rr').value/1200,n=$('#tr').value*12,e=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);$('#la').textContent=rupee(P)+' ('+$('#lr').value+'%)';$('#ir').textContent=$('#rr').value+'%';$('#tn').textContent=$('#tr').value+' years';$('#emi').textContent=rupee(e)};['lr','rr','tr'].forEach(function(i){$('#'+i).oninput=f});f()}}
function compare(){var hs=cmp.map(by),rows=[['Price',function(h){return A.purpose==='rent'?h.rent:h.p},'lo',function(h){return A.purpose==='rent'?rupee(h.rent)+'/mo':money(h.p)}],['Match',score,'hi',function(h){return score(h)+'%'}],['Size',function(h){return h.sq},'hi',function(h){return h.sq+' sq ft'}],['Bedrooms',function(h){return h.bhk},'hi',function(h){return h.bhk+' BHK'}],['Price / sq ft',function(h){return h.p*1e5/h.sq},'lo',function(h){return rupee(h.p*1e5/h.sq)}],['Age',function(h){return h.age},'lo',function(h){return h.age+' yrs'}],['Area',null,null,function(h){return h.a}],['Amenities',null,null,function(h){return h.am.join(', ')}]];
  modal('<div style="padding:26px"><h2 class="serif" style="font-size:1.9rem;margin-bottom:12px">Side-by-side</h2><div style="overflow:auto"><table><tr><th></th>'+hs.map(function(h){return '<td><b>'+h.t+'</b></td>'}).join('')+'</tr>'+rows.map(function(r){var best=null;if(r[1]){var vals=hs.map(r[1]);best=r[2]==='lo'?Math.min.apply(0,vals):Math.max.apply(0,vals)}return '<tr><th>'+r[0]+'</th>'+hs.map(function(h){return '<td class="'+(r[1]&&r[1](h)===best?'best':'')+'">'+r[3](h)+(r[1]&&r[1](h)===best?' ★':'')+'</td>'}).join('')+'</tr>'}).join('')+'</table></div><p style="color:var(--muted);font-size:.84rem;margin-top:10px">★ marks the best value in each row.</p></div>')}
function visit(id){var h=by(id),d=0,t=null;function draw(){modal('<div class="visit"><h2>Visit '+h.t+'</h2><p style="color:var(--muted)">Pick a day and time — our agent will meet you at the property.</p><div class="dts">'+[1,2,3,4,5,6].map(function(i){var x=new Date();x.setDate(x.getDate()+i);return '<button data-dd="'+i+'" aria-pressed="'+(d===i)+'">'+x.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})+'</button>'}).join('')+'</div><div class="tms">'+['10:00 AM','12:00 PM','3:00 PM','5:00 PM'].map(function(x){return '<button data-tt="'+x+'" aria-pressed="'+(t===x)+'">'+x+'</button>'}).join('')+'</div><input id="vn" placeholder="Your name (demo)" autocomplete="off"><button class="cta c" id="vb" style="width:100%;margin-top:14px" '+(d&&t?'':'disabled')+'>Confirm visit</button></div>')}
  draw();$('#mod').onclick=function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.dd){d=+b.dataset.dd;var n=$('#vn').value;draw();$('#vn').value=n}if(b.dataset.tt){t=b.dataset.tt;var n2=$('#vn').value;draw();$('#vn').value=n2}
    if(b.id==='vb'){if($('#vn').value.trim().length<2)return toast('Please enter a name');var x=new Date();x.setDate(x.getDate()+d);modal('<div class="visit" style="text-align:center"><div style="font-size:3rem">🏡</div><h2>Visit booked!</h2><p style="color:var(--muted);margin:8px 0 16px">'+h.t+' · '+x.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})+' at '+t+'</p><p style="font-size:.9rem">Agent <b>Rakesh (demo)</b> will call you 1 hour before.</p><button class="cta" data-x style="margin-top:18px">Back to homes</button></div>');$('#mod').onclick=null;toast('Site visit confirmed')}}}
document.addEventListener('click',function(e){var b=e.target.closest('button,[data-d]');if(!b)return;
  if(b.dataset.o!==undefined){var q=Q[step],v=b.dataset.o;A[q.k]=q.k==='bhk'&&v!=='4+'?+v:v;quiz()}
  else if(b.id==='qn'){if(step<3){step++;quiz()}else{results();window.scrollTo({top:0,behavior:'smooth'})}}
  else if(b.id==='qb'){step--;quiz()}
  else if(b.id==='redo'||b.id==='home'){step=0;quiz()}
  else if(b.dataset.d){detail(+b.dataset.d)}
  else if(b.dataset.s){var id=+b.dataset.s,i=saved.indexOf(id);if(i>-1)saved.splice(i,1);else{saved.push(id);toast('Saved to shortlist ♥')}try{localStorage.setItem('gf_saved',JSON.stringify(saved))}catch(e){}$('#sc').textContent=saved.length;b.classList.toggle('on',i<0);b.textContent=i<0?'♥ Saved':'♡ Save'}
  else if(b.dataset.c){var c=+b.dataset.c,j=cmp.indexOf(c);if(j>-1)cmp.splice(j,1);else{if(cmp.length>=3)return toast('You can compare up to 3 homes');cmp.push(c)}b.classList.toggle('on',j<0);b.textContent=j<0?'✓ Comparing':'+ Compare';tray()}
  else if(b.dataset.v){visit(+b.dataset.v)}
  else if(b.id==='cmp'){if(cmp.length>1)compare()}
  else if(b.id==='savedBtn'){if(!A.purpose)A.purpose='buy';results(true)}
  else if(b.hasAttribute('data-x')){$('#mbg').classList.remove('on')}
});
document.addEventListener('change',function(e){if(e.target.id==='sort'){sort=e.target.value;results()}});
$('#mbg').addEventListener('click',function(e){if(e.target.id==='mbg')$('#mbg').classList.remove('on')});
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('#mbg').classList.remove('on')});
$('#home').addEventListener('click',function(e){e.preventDefault()});
$('#sc').textContent=saved.length;quiz();
})();
</script>
</body>
</html>
