<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gyan Path (Demo) — E-learning demo by KnowMinds Media</title>
<meta name="description" content="Gyan Path is a demo e-learning platform built by KnowMinds Media: courses, lesson player, progress tracking, timed quizzes and downloadable certificates.">
<link rel="canonical" href="https://knowmindsmedia.com/learn/">
<meta name="theme-color" content="#3730a3">

<style>
:root{--ind:#3730a3;--ind-l:#e0e7ff;--paper:#fffbf0;--ink:#1e1b4b;--muted:#6b6880;--line:#ebe3cc;--hl:#fde68a;--red:#e11d48;--green:#059669}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:Lexend,system-ui,sans-serif;font-weight:300;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
b,strong{font-weight:600}
.hand{font-family:Caveat,cursive;font-weight:700}
.demo{background:var(--ind);color:#e0e7ff;text-align:center;font-size:.8rem;padding:7px 12px}
.demo a{color:#fff;font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:72px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.25rem}
.logo svg{width:34px;height:34px}
.logo .hand{color:var(--red);font-size:1.4rem;margin-left:2px}
.who{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:5px 12px 5px 5px;font-weight:500;font-size:.88rem}
.who i{width:28px;height:28px;border-radius:50%;background:var(--hl);display:grid;place-items:center;font-style:normal;font-weight:700}
.btn{border:2px solid var(--ink);background:var(--ind);color:#fff;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:.1s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.w{background:#fff;color:var(--ink)}
.btn.y{background:var(--hl);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hero{padding:30px 0 20px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
.hero h1{font-size:clamp(2rem,4.4vw,3.3rem);line-height:1.1;font-weight:600;letter-spacing:-.02em}
.hero h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit}
.hero .hand{font-size:1.8rem;color:var(--red);transform:rotate(-3deg);display:inline-block;margin-top:10px}
.hero p{color:var(--muted);margin-top:12px;font-size:1.05rem}
.name{display:flex;gap:8px;margin-top:20px;max-width:420px}
.name input{flex:1;border:2px solid var(--ink);border-radius:12px;padding:11px 14px;background:#fff;font-size:16px}
.doodle{background:#fff;border:2px solid var(--ink);border-radius:24px;padding:22px;box-shadow:6px 6px 0 var(--ink);transform:rotate(1.5deg)}
.doodle .hand{font-size:1.6rem}
@media (max-width:800px){.hero{grid-template-columns:1fr}}
.courses{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:10px 0 40px}
@media (max-width:860px){.courses{grid-template-columns:1fr}}
.course{background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:4px 4px 0 var(--ink)}
.cover{height:140px;display:grid;place-items:center;font-size:3.4rem;border-bottom:2px solid var(--ink);position:relative}
.cover .tag{position:absolute;top:10px;left:10px;background:#fff;border:2px solid var(--ink);border-radius:8px;font-size:.72rem;font-weight:600;padding:2px 8px}
.cbody{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cbody h3{font-size:1.1rem;font-weight:600}
.cbody p{color:var(--muted);font-size:.9rem;flex:1}
.cmeta{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted);margin-top:8px}
.pbar{height:8px;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden;background:#fff;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--green)}
/* course view */
.cv{display:grid;grid-template-columns:300px 1fr;gap:20px;margin:10px 0 40px}
@media (max-width:860px){.cv{grid-template-columns:1fr}}
.side{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:18px;align-self:start}
.ring{width:110px;height:110px;margin:0 auto 10px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.4rem}
.les{display:grid;gap:6px;margin-top:12px}
.les button{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px;text-align:left;cursor:pointer;font-size:.88rem}
.les button[aria-current="true"]{border-color:var(--ind);background:var(--ind-l);font-weight:500}
.les i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:.72rem;flex:none;background:#fff}
.les i.d{background:var(--green);color:#fff;border-color:var(--green)}
.les button:disabled{opacity:.5;cursor:not-allowed}
.stage{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:26px;min-height:420px;display:flex;flex-direction:column;box-shadow:6px 6px 0 var(--ink)}
.stage .k{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.stage h2{font-size:1.6rem;font-weight:600;margin:6px 0 16px}
.slide{flex:1;font-size:1.05rem;line-height:1.7;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.slide ul{padding-left:20px;margin-top:8px}
.slide .note{font-family:Caveat;font-weight:700;font-size:1.5rem;color:var(--red);margin-top:14px;transform:rotate(-1.5deg);display:inline-block}
.sdots{display:flex;gap:6px;margin:18px 0}
.sdots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.sdots i.on{background:var(--ink)}
.snav{display:flex;justify-content:space-between;gap:10px}
.timer{font-weight:700;font-size:1.1rem;background:var(--hl);border:2px solid var(--ink);border-radius:10px;padding:4px 12px}
.timer.low{background:#fecdd3;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.opts{display:grid;gap:10px;margin-top:10px}
.opts button{border:2px solid var(--ink);background:#fff;border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;font-size:.98rem}
.opts button:hover{background:var(--ind-l)}
.opts button.ok{background:#d1fae5;border-color:var(--green)}
.opts button.no{background:#ffe4e6;border-color:var(--red)}
.res{text-align:center;padding:10px 0}
.res .big{font-size:4rem;font-weight:700;line-height:1}
canvas{width:100%;max-width:640px;border:2px solid var(--ink);border-radius:12px;margin:14px auto;display:block;background:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px) rotate(-1deg);background:var(--hl);border:2px solid var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:.3s;z-index:60;box-shadow:3px 3px 0 var(--ink)}
.toast.on{opacity:1;transform:translate(-50%,0) rotate(-1deg)}
footer{padding:20px 0 34px;font-size:.85rem;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:2px dashed var(--ink);padding-top:18px}
footer a{color:var(--ind);font-weight:600}
</style>
</head>
